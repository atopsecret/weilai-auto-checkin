# 蔚来签到调试 - 最简配置
# 用于测试脚本是否能正常工作

[Script]
# 测试脚本是否工作 - 访问任意网页都会触发
测试脚本响应 = type=http-request,pattern=^https://.*,script-path=https://raw.githubusercontent.com/atopsecret/weilai-auto-checkin/main/weilai-auto-checkin.js,timeout=10

# 蔚来专用拦截 - 只拦截蔚来域名
蔚来请求拦截 = type=http-request,pattern=^https://.*\.nio\.com.*,script-path=https://raw.githubusercontent.com/atopsecret/weilai-auto-checkin/main/weilai-auto-checkin.js,timeout=10

[MITM]
# 拦截所有蔚来相关域名
hostname = *.nio.com, gateway-front-external.nio.com

# 使用步骤：
# 1. 将此配置添加到Surge配置文件
# 2. 重新加载配置
# 3. 访问任意https网站，查看是否有脚本执行日志
# 4. 如果有日志，说明脚本工作正常
# 5. 然后打开蔚来APP，查看是否拦截到请求