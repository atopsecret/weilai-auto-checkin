# 蔚来全自动签到 - Surge 远程脚本配置
# 复制以下内容到你的 Surge 配置文件中
# 
# 项目地址: https://github.com/atopsecret/weilai-auto-checkin
# 脚本地址: https://raw.githubusercontent.com/atopsecret/weilai-auto-checkin/main/weilai-auto-checkin.js

[Script]
# ==================== 蔚来全自动签到（远程脚本）====================

# Token自动抓取 - 拦截蔚来APP请求，自动保存token（宽泛匹配）
蔚来Token抓取 = type=http-request,pattern=^https://.*\.nio\.com.*,script-path=https://raw.githubusercontent.com/atopsecret/weilai-auto-checkin/main/weilai-auto-checkin.js,timeout=10

# 调试用 - 拦截所有蔚来请求并记录
蔚来调试拦截 = type=http-request,pattern=^https://.*nio\.com.*,script-path=https://raw.githubusercontent.com/atopsecret/weilai-auto-checkin/main/check-status.js,timeout=10

# 定时签到任务 - 每天早上9点自动签到
蔚来自动签到 = type=cron,cronexp=0 9 * * *,script-path=https://raw.githubusercontent.com/atopsecret/weilai-auto-checkin/main/weilai-auto-checkin.js,timeout=30,wake-system=1

# 手动签到 - 访问 https://weilai.checkin 手动触发签到
蔚来手动签到 = type=http-request,pattern=^https://manual-checkin\.test$,script-path=https://raw.githubusercontent.com/atopsecret/weilai-auto-checkin/main/weilai-auto-checkin.js,timeout=30

# Token状态检查 - 访问 https://weilai.token 查看token状态
蔚来Token状态 = type=http-request,pattern=^https://token-status\.test$,script-path=https://raw.githubusercontent.com/atopsecret/weilai-auto-checkin/main/weilai-auto-checkin.js,timeout=10

[MITM]
# ==================== HTTPS 解密配置 ====================
# 必须添加以下域名才能拦截token
hostname = gateway-front-external.nio.com, app.nio.com, api.nio.com

[URL Rewrite]
# ==================== 便捷访问规则 ====================
# 手动签到快捷方式
^https://weilai\.checkin$ https://manual-checkin.test 302

# Token状态检查快捷方式
^https://weilai\.token$ https://token-status.test 302

# ==================== 使用说明 ====================
#
# 🚀 快速开始：
# 1. 将上述配置复制到你的Surge配置文件
# 2. 重启Surge或重新加载配置
# 3. 打开蔚来APP，进行任意操作（浏览、签到等）
# 4. 脚本会自动抓取并保存token
# 5. 第二天早上9点会自动签到
#
# 🔧 手动操作：
# - 手动签到：Safari访问 https://weilai.checkin
# - 检查Token：Safari访问 https://weilai.token
#
# ⏰ 定时任务时间修改：
# - 每天8点：cronexp=0 8 * * *
# - 每天22点：cronexp=0 22 * * *
# - 格式：分 时 日 月 周
#
# 🔄 脚本更新：
# - 使用远程脚本，自动获取最新版本
# - 无需手动下载或更新文件
# - 每次执行都使用GitHub上的最新版本
#
# ⚠️ 注意事项：
# - 确保MITM功能已开启
# - 确保CA证书已安装并信任
# - 首次使用需要在蔚来APP中进行操作以获取token
# - Token会自动保存在本地，有效期30天
#
# 🔍 故障排除：
# - 查看Surge脚本执行日志
# - 确认网络连接正常
# - 确认蔚来APP版本最新
# - 如有问题请访问项目地址查看文档

# ==================== 高级配置（可选）====================

# 如果需要更精确的拦截，可以使用以下规则：
# 蔚来Token抓取-精确 = type=http-request,pattern=^https://gateway-front-external\.nio\.com/moat/\d+/c/award_cn/.*,script-path=https://raw.githubusercontent.com/atopsecret/weilai-auto-checkin/main/weilai-auto-checkin.js,timeout=10

# 如果需要调试模式：
# 蔚来调试模式 = type=http-request,pattern=^https://debug-weilai\.test$,script-path=https://raw.githubusercontent.com/atopsecret/weilai-auto-checkin/main/weilai-auto-checkin.js,timeout=30,debug=1