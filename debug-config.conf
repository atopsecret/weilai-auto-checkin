# 蔚来签到调试配置
# 用于排查问题的简化配置

[Script]
# 调试用 - 拦截所有蔚来相关请求
蔚来调试拦截 = type=http-request,pattern=^https://.*nio\.com.*,script-path=https://raw.githubusercontent.com/atopsecret/weilai-auto-checkin/main/weilai-auto-checkin.js,timeout=10

# 手动测试 - 访问 https://test.debug 触发
手动测试 = type=http-request,pattern=^https://test\.debug$,script-path=https://raw.githubusercontent.com/atopsecret/weilai-auto-checkin/main/weilai-auto-checkin.js,timeout=10

[MITM]
# 拦截所有蔚来域名
hostname = *.nio.com

[URL Rewrite]
# 方便测试的重写规则
^https://test$ https://test.debug 302

# 使用方法：
# 1. 将此配置添加到Surge
# 2. 重新加载配置
# 3. 在Safari访问 https://test 看是否有反应
# 4. 打开蔚来APP操作，查看Surge请求记录
# 5. 检查脚本执行日志