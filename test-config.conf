# 测试配置 - 验证脚本基本功能
[Script]
# 测试脚本是否工作 - 访问百度会触发
测试脚本 = type=http-request,pattern=^https://www\.baidu\.com.*,script-path=https://raw.githubusercontent.com/atopsecret/weilai-auto-checkin/main/check-status.js,timeout=10

[MITM]
hostname = www.baidu.com

# 使用方法：
# 1. 将此配置添加到Surge
# 2. 重新加载配置  
# 3. 用Safari访问 https://www.baidu.com
# 4. 如果收到通知"脚本正常工作"，说明基本功能OK